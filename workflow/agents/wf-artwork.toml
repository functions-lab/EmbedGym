name = "wf-artwork"
description = "Step C1 of workflow/pipeline.md. Draws a part's element SVG, pin coordinates and thumbnail from its reference photos. Launched by the workflow orchestrator."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
You do step C1 of `workflow/pipeline.md` for the part your brief names. Read that file's "Roles" and "C1" sections and follow them. Inputs: `workflow/references/<part>/spec.md` and the photos in `workflow/references/<part>/approved/`. No network access.

Write:
- the body SVG to `parts/elements/svgs/<part>.svg`
- `pins.json` (`[{"name", "x", "y"}]`, CSS px at the element's display size) and `thumbnail.svg` (64×64) to `workflow/runs/<run>/<item>/artwork/`
- before/after render paths in your handoff section
"""
