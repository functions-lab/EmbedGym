<svg xmlns="http://www.w3.org/2000/svg" width="144" height="166" viewBox="0 0 144 166">
  <!-- PCB -->
  <rect x="0" y="0" width="144" height="166" rx="6" fill="#17161c"/>

  <!-- Metal sensor can: dark base frame -->
  <rect x="6" y="3" width="133" height="121" rx="4" fill="#1e1e22"/>
  <!-- Blue anodized lid: right column + full lower section (L-shape) -->
  <path d="M86 7 H133 a2 2 0 0 1 2 2 V118 a2 2 0 0 1-2 2 H12 a2 2 0 0 1-2-2 V72 a2 2 0 0 1 2-2 H82 a4 4 0 0 0 4-4 Z" fill="#2b8fd6"/>
  <!-- dark corner clips of the can -->
  <rect x="126" y="7"  width="9" height="9" rx="3" fill="#1e1e22"/>
  <rect x="10"  y="111" width="9" height="9" rx="3" fill="#1e1e22"/>
  <rect x="126" y="111" width="9" height="9" rx="3" fill="#1e1e22"/>

  <!-- Black fan-inlet module, top-left -->
  <rect x="7" y="3.5" width="77" height="64" rx="2.5" fill="#232327"/>
  <!-- inlet opening -->
  <rect x="22" y="13" width="47" height="44" rx="1.5" fill="#0a0a0c"/>
  <!-- screws -->
  <g stroke="#26262a" stroke-width="1">
    <circle cx="15.5" cy="10.5" r="3.8" fill="#55555c"/>
    <circle cx="76"   cy="60"   r="3.8" fill="#55555c"/>
  </g>
  <g stroke="#2c2c30" stroke-width="1.1" stroke-linecap="round">
    <path d="M12.9 10.5 h5.2 M15.5 7.9 v5.2"/>
    <path d="M73.4 60 h5.2 M76 57.4 v5.2"/>
  </g>

  <!-- ============ PCB strip ============ -->
  <!-- JST-SH (STEMMA QT) connectors, left and right edges -->
  <g>
    <rect x="0" y="126" width="15" height="20" rx="1.5" fill="#e9e2d2"/>
    <rect x="2" y="129" width="9" height="14" rx="1" fill="#cfc7b4"/>
    <g fill="#c9a24a">
      <rect x="10" y="130" width="4" height="1.6"/>
      <rect x="10" y="133.4" width="4" height="1.6"/>
      <rect x="10" y="136.8" width="4" height="1.6"/>
      <rect x="10" y="140.2" width="4" height="1.6"/>
    </g>
  </g>
  <g>
    <rect x="129" y="126" width="15" height="20" rx="1.5" fill="#e9e2d2"/>
    <rect x="133" y="129" width="9" height="14" rx="1" fill="#cfc7b4"/>
    <g fill="#c9a24a">
      <rect x="130" y="130" width="4" height="1.6"/>
      <rect x="130" y="133.4" width="4" height="1.6"/>
      <rect x="130" y="136.8" width="4" height="1.6"/>
      <rect x="130" y="140.2" width="4" height="1.6"/>
    </g>
  </g>

  <!-- Silkscreen part label -->
  <g fill="#f4f4f4" text-anchor="middle" font-family="monospace">
    <text x="72" y="133" font-size="8.5" font-weight="700">PMSA003I</text>
    <text x="72" y="141" font-size="5.5" font-weight="600">PM2.5 Air Sensor</text>
  </g>

  <!-- small parts for flavor: power LED + passives -->
  <rect x="19" y="139" width="4.5" height="3" rx="0.5" fill="#3fae5a"/>
  <rect x="25.5" y="139" width="4" height="3" rx="0.5" fill="#6b6b72"/>
  <rect x="114" y="139" width="4" height="3" rx="0.5" fill="#6b6b72"/>
  <rect x="119.5" y="139" width="4" height="3" rx="0.5" fill="#8a7a5a"/>

  <!-- Mounting holes -->
  <circle cx="15"  cy="155" r="6.5" fill="#0a0a0c" stroke="#55555c" stroke-width="1.6"/>
  <circle cx="129" cy="155" r="6.5" fill="#0a0a0c" stroke="#55555c" stroke-width="1.6"/>

  <!-- Through-hole pads, 0.1in pitch (9.6 px) centered at x=72, y=155 -->
  <g>
    <circle cx="43.2"  cy="155" r="3.5" fill="#e0b34a"/><circle cx="43.2"  cy="155" r="1.6" fill="#14131a"/>
    <circle cx="52.8"  cy="155" r="3.5" fill="#e0b34a"/><circle cx="52.8"  cy="155" r="1.6" fill="#14131a"/>
    <circle cx="62.4"  cy="155" r="3.5" fill="#e0b34a"/><circle cx="62.4"  cy="155" r="1.6" fill="#14131a"/>
    <circle cx="72"    cy="155" r="3.5" fill="#e0b34a"/><circle cx="72"    cy="155" r="1.6" fill="#14131a"/>
    <circle cx="81.6"  cy="155" r="3.5" fill="#e0b34a"/><circle cx="81.6"  cy="155" r="1.6" fill="#14131a"/>
    <circle cx="91.2"  cy="155" r="3.5" fill="#e0b34a"/><circle cx="91.2"  cy="155" r="1.6" fill="#14131a"/>
    <circle cx="100.8" cy="155" r="3.5" fill="#e0b34a"/><circle cx="100.8" cy="155" r="1.6" fill="#14131a"/>
  </g>

  <!-- Pin labels, alternating below / above like the silkscreen -->
  <g fill="#f4f4f4" text-anchor="middle" font-family="monospace" font-size="5" font-weight="700">
    <text x="43.2"  y="164">VIN</text>
    <text x="52.8"  y="149.5">3Vo</text>
    <text x="62.4"  y="164">GND</text>
    <text x="72"    y="149.5">SCL</text>
    <text x="81.6"  y="164">SDA</text>
    <text x="91.2"  y="149.5">RST</text>
    <text x="100.8" y="164">SET</text>
  </g>
</svg>
