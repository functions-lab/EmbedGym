<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <!-- red SparkFun PCB, 25.4 x 12.7 mm drawn at ~4.72 px/mm -->
  <rect x="0.75" y="0.75" width="118.5" height="58.5" rx="3"
        fill="#b81f24" stroke="#7d1418" stroke-width="1.5"/>

  <!-- mounting holes (left corners, as on the real board) -->
  <g>
    <circle cx="6.5" cy="6.5" r="2.1" fill="#d4a017"/>
    <circle cx="6.5" cy="6.5" r="1" fill="#0d0d0d"/>
    <circle cx="6.5" cy="53.5" r="2.1" fill="#d4a017"/>
    <circle cx="6.5" cy="53.5" r="1" fill="#0d0d0d"/>
  </g>

  <!-- title silkscreen (top-left, as on the real board) -->
  <g font-family="sans-serif" font-size="4.6" font-weight="bold" fill="#ffffff">
    <text x="13" y="9.5">Pulse Oximeter and</text>
    <text x="13" y="15.5">Heart Rate Monitor</text>
  </g>

  <!-- Qwiic / I2C connector, left edge -->
  <rect x="0.75" y="22" width="7" height="16" rx="1" fill="#1c1c1c" stroke="#0d0d0d" stroke-width="0.7"/>
  <g fill="#c9a24a">
    <rect x="4.6" y="24" width="2.8" height="1.2"/>
    <rect x="4.6" y="27.6" width="2.8" height="1.2"/>
    <rect x="4.6" y="31.2" width="2.8" height="1.2"/>
    <rect x="4.6" y="34.8" width="2.8" height="1.2"/>
  </g>
  <text x="11.5" y="30" font-family="sans-serif" font-size="4" font-weight="bold"
        fill="#ffffff" transform="rotate(-90 11.5 30)" text-anchor="middle">I2C</text>

  <!-- MAX32664 biometric hub (SOIC, left of the optical package) -->
  <rect x="25" y="26" width="10" height="8" rx="0.5" fill="#2b2b2b" stroke="#151515" stroke-width="0.5"/>
  <g fill="#c9ced6">
    <rect x="25.8" y="24.6" width="1.6" height="1.5"/>
    <rect x="29.2" y="24.6" width="1.6" height="1.5"/>
    <rect x="32.6" y="24.6" width="1.6" height="1.5"/>
    <rect x="25.8" y="33.9" width="1.6" height="1.5"/>
    <rect x="29.2" y="33.9" width="1.6" height="1.5"/>
    <rect x="32.6" y="33.9" width="1.6" height="1.5"/>
  </g>

  <!-- MAX30101 optical sensor package (black, centre-right) -->
  <rect x="43" y="21.5" width="24" height="17" rx="1" fill="#141414" stroke="#000000" stroke-width="0.7"/>
  <!-- LED emitter aperture -->
  <rect x="46" y="25" width="6.5" height="10" rx="0.8" fill="#2c2c2c" stroke="#484848" stroke-width="0.5"/>
  <circle cx="49.2" cy="28" r="1.5" fill="#7a2020"/>
  <circle cx="49.2" cy="32" r="1.5" fill="#7a2020"/>
  <!-- photodetector window (tan/olive, as in the photo) -->
  <rect x="56" y="25" width="8.5" height="10" rx="0.8" fill="#8a7a44" stroke="#5f5428" stroke-width="0.5"/>

  <!-- passives, kept clear of the silkscreen text -->
  <g stroke="#8a919c" stroke-width="0.4">
    <rect x="72" y="9" width="7" height="4" fill="#c9ced6"/>
    <rect x="83" y="9" width="7" height="4" fill="#c9ced6"/>
    <rect x="83" y="16" width="7" height="4" fill="#c9ced6"/>
    <rect x="30" y="18" width="6" height="4" fill="#c9a06a"/>
    <rect x="42" y="44" width="7" height="4" fill="#c9ced6"/>
    <rect x="54" y="44" width="7" height="4" fill="#c9ced6"/>
    <rect x="66" y="44" width="7" height="4" fill="#c9ced6"/>
    <rect x="14" y="42" width="5" height="7" fill="#c9ced6"/>
    <rect x="22" y="42" width="5" height="7" fill="#c9ced6"/>
  </g>

  <!-- through-hole pads: all six in one right-edge column at 0.1" (9.6 px) pitch.
       The real board tucks MFIO inboard for want of space; a single evenly
       spaced column keeps every label legible and every wire unambiguous. -->
  <g>
    <circle cx="112" cy="6" r="3.2" fill="#d4a017"/><circle cx="112" cy="6" r="1.5" fill="#0d0d0d"/>
    <circle cx="112" cy="15.6" r="3.2" fill="#d4a017"/><circle cx="112" cy="15.6" r="1.5" fill="#0d0d0d"/>
    <circle cx="112" cy="25.2" r="3.2" fill="#d4a017"/><circle cx="112" cy="25.2" r="1.5" fill="#0d0d0d"/>
    <circle cx="112" cy="34.8" r="3.2" fill="#d4a017"/><circle cx="112" cy="34.8" r="1.5" fill="#0d0d0d"/>
    <circle cx="112" cy="44.4" r="3.2" fill="#d4a017"/><circle cx="112" cy="44.4" r="1.5" fill="#0d0d0d"/>
    <circle cx="112" cy="54" r="3.2" fill="#d4a017"/><circle cx="112" cy="54" r="1.5" fill="#0d0d0d"/>
  </g>

  <!-- column pin labels, left of each pad -->
  <g font-family="sans-serif" font-size="4.6" font-weight="bold" fill="#ffffff" text-anchor="end">
    <text x="107" y="7.7">MFIO</text>
    <text x="107" y="17.3">RST</text>
    <text x="107" y="26.9">SCL</text>
    <text x="107" y="36.5">SDA</text>
    <text x="107" y="46.1">3V3</text>
    <text x="107" y="55.7">GND</text>
  </g>
</svg>
