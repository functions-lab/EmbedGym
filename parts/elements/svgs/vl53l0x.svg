<svg width="96" height="67" viewBox="0 0 96 67" xmlns="http://www.w3.org/2000/svg">
  <!-- black PCB -->
  <rect x="0.75" y="0.75" width="94.5" height="65.5" rx="5"
        fill="#1c1c1c" stroke="#000000" stroke-width="1.5"/>

  <!-- mounting holes (4 corners) -->
  <g>
    <circle cx="9" cy="9" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="4.4" fill="#d4a017"/>
    <circle cx="9" cy="9" r="2.5" fill="#0d0d0d"/>
    <circle cx="87" cy="9" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="87" cy="9" r="4.4" fill="#d4a017"/>
    <circle cx="87" cy="9" r="2.5" fill="#0d0d0d"/>
    <circle cx="9" cy="57" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="9" cy="57" r="4.4" fill="#d4a017"/>
    <circle cx="9" cy="57" r="2.5" fill="#0d0d0d"/>
    <circle cx="87" cy="57" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="87" cy="57" r="4.4" fill="#d4a017"/>
    <circle cx="87" cy="57" r="2.5" fill="#0d0d0d"/>
  </g>

  <!-- title silkscreen -->
  <text x="52" y="10.5" text-anchor="middle" font-family="sans-serif" font-size="8"
        font-weight="bold" fill="#ffffff">VL53L0X</text>
  <text x="52" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="5"
        font-weight="bold" fill="#ffffff">ToF Distance</text>

  <!-- side connectors (I2C, simplified) -->
  <rect x="0.75" y="23" width="6.5" height="19" rx="1" fill="#e8e5dd" stroke="#b3afa4" stroke-width="0.7"/>
  <rect x="88.75" y="23" width="6.5" height="19" rx="1" fill="#e8e5dd" stroke="#b3afa4" stroke-width="0.7"/>

  <!-- ToF sensor module (center) with emitter/receiver apertures -->
  <rect x="42.5" y="22" width="11" height="19" rx="1" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="0.8"/>
  <rect x="44.2" y="23.7" width="7.6" height="15.6" fill="#1a1a1a"/>
  <circle cx="48" cy="27" r="1.5" fill="#000000" stroke="#3d3d3d" stroke-width="0.5"/>
  <circle cx="48" cy="36" r="1.5" fill="#000000" stroke="#3d3d3d" stroke-width="0.5"/>

  <!-- passives -->
  <g stroke="#8a919c" stroke-width="0.5">
    <rect x="24" y="25" width="9" height="6" fill="#c9a06a"/>
    <rect x="24" y="35" width="9" height="6" fill="#c9a06a"/>
    <rect x="60" y="23" width="10" height="7" fill="#3a3f46"/>
    <rect x="61" y="35" width="8" height="5" fill="#c9ced6"/>
    <rect x="14" y="24" width="5" height="4" fill="#c9ced6"/>
  </g>
  <!-- power LED -->
  <rect x="15" y="34" width="4" height="6" fill="#3fae4a" stroke="#8a919c" stroke-width="0.5"/>

  <!-- staggered pin labels (as on the real silkscreen) -->
  <g font-family="sans-serif" font-size="5" font-weight="bold" fill="#ffffff">
    <text x="33.6" y="51.5" text-anchor="middle">GND</text>
    <text x="52.8" y="51.5" text-anchor="middle">SDA</text>
    <text x="72"   y="51.5" text-anchor="middle">XSHUT</text>
    <text x="24"   y="65" text-anchor="middle">VIN</text>
    <text x="43.2" y="65" text-anchor="middle">SCL</text>
    <text x="62.4" y="65" text-anchor="middle">GPIO</text>
  </g>

  <!-- through-hole pins: VIN GND SCL SDA GPIO XSHUT, 0.1" pitch -->
  <g>
    <circle cx="24"   cy="57" r="3.4" fill="#d4a017"/><circle cx="24"   cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="33.6" cy="57" r="3.4" fill="#d4a017"/><circle cx="33.6" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="43.2" cy="57" r="3.4" fill="#d4a017"/><circle cx="43.2" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="52.8" cy="57" r="3.4" fill="#d4a017"/><circle cx="52.8" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="62.4" cy="57" r="3.4" fill="#d4a017"/><circle cx="62.4" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="72"   cy="57" r="3.4" fill="#d4a017"/><circle cx="72"   cy="57" r="1.6" fill="#0d0d0d"/>
  </g>
</svg>
