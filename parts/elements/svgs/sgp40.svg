<svg width="96" height="67" viewBox="0 0 96 67" xmlns="http://www.w3.org/2000/svg">
  <!-- black PCB -->
  <rect x="0.75" y="0.75" width="94.5" height="65.5" rx="5"
        fill="#1c1c1c" stroke="#000000" stroke-width="1.5"/>

  <!-- mounting holes (4 corners) -->
  <g>
    <circle cx="9" cy="9" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="4.4" fill="#d4a017"/>
    <circle cx="9" cy="9" r="2.5" fill="#0d0d0d"/>
    <circle cx="87" cy="9" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="87" cy="9" r="4.4" fill="#d4a017"/>
    <circle cx="87" cy="9" r="2.5" fill="#0d0d0d"/>
    <circle cx="9" cy="57" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="9" cy="57" r="4.4" fill="#d4a017"/>
    <circle cx="9" cy="57" r="2.5" fill="#0d0d0d"/>
    <circle cx="87" cy="57" r="5.4" fill="none" stroke="#e8e8e8" stroke-width="0.8"/>
    <circle cx="87" cy="57" r="4.4" fill="#d4a017"/>
    <circle cx="87" cy="57" r="2.5" fill="#0d0d0d"/>
  </g>

  <!-- title silkscreen -->
  <text x="48" y="11" text-anchor="middle" font-family="sans-serif" font-size="8"
        font-weight="bold" fill="#ffffff">SGP40</text>
  <text x="48" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="5"
        font-weight="bold" fill="#ffffff">MOX Gas Sensor</text>

  <!-- STEMMA QT / Qwiic connectors, left and right edges -->
  <rect x="0.75" y="23" width="6.5" height="19" rx="1" fill="#e8e5dd" stroke="#b3afa4" stroke-width="0.7"/>
  <rect x="88.75" y="23" width="6.5" height="19" rx="1" fill="#e8e5dd" stroke="#b3afa4" stroke-width="0.7"/>
  <g fill="#b9924a">
    <rect x="4.4" y="25.4" width="2.6" height="1.3"/>
    <rect x="4.4" y="29.4" width="2.6" height="1.3"/>
    <rect x="4.4" y="33.4" width="2.6" height="1.3"/>
    <rect x="4.4" y="37.4" width="2.6" height="1.3"/>
    <rect x="89" y="25.4" width="2.6" height="1.3"/>
    <rect x="89" y="29.4" width="2.6" height="1.3"/>
    <rect x="89" y="33.4" width="2.6" height="1.3"/>
    <rect x="89" y="37.4" width="2.6" height="1.3"/>
  </g>

  <!-- SGP40 MOX sensor package (centre) — grey ceramic with round gas-permeable membrane -->
  <rect x="41" y="25" width="14" height="15" rx="0.8" fill="#8f9296" stroke="#5d6064" stroke-width="0.7"/>
  <text x="48" y="28.8" text-anchor="middle" font-family="sans-serif" font-size="3.4"
        fill="#3a3d40">SGP40</text>
  <circle cx="48" cy="34.2" r="3.8" fill="#e6e8ea" stroke="#9aa0a4" stroke-width="0.6"/>

  <!-- passives, regulator, level shifter -->
  <g stroke="#8a919c" stroke-width="0.5">
    <!-- decoupling caps (tan MLCC) -->
    <rect x="26" y="24" width="9" height="5.5" fill="#c9a06a"/>
    <rect x="26" y="37" width="9" height="5.5" fill="#c9a06a"/>
    <rect x="30" y="30.5" width="7" height="5" fill="#c9a06a"/>
    <!-- 3.3V regulator (SOT-23) -->
    <rect x="17.5" y="29.5" width="9" height="7" fill="#2b2b2b"/>
    <!-- level shifter / FETs (right side) -->
    <rect x="60" y="24.5" width="10" height="6.5" fill="#2b2b2b"/>
    <rect x="61" y="34" width="8" height="5.5" fill="#2b2b2b"/>
    <!-- resistor array -->
    <rect x="73" y="25" width="9" height="5" fill="#2b2b2b"/>
    <rect x="16" y="23" width="4.5" height="4" fill="#c9ced6"/>
  </g>
  <!-- power LED -->
  <rect x="16" y="39" width="6" height="3.5" fill="#e8b34a" stroke="#8a919c" stroke-width="0.5"/>

  <!-- staggered pin labels (as on the real silkscreen) -->
  <g font-family="sans-serif" font-size="5" font-weight="bold" fill="#ffffff">
    <text x="38.4" y="51.5" text-anchor="middle">3.3V</text>
    <text x="57.6" y="51.5" text-anchor="middle">SCL</text>
    <text x="28.8" y="65" text-anchor="middle">VIN</text>
    <text x="48"   y="65" text-anchor="middle">GND</text>
    <text x="67.2" y="65" text-anchor="middle">SDA</text>
  </g>

  <!-- through-hole pins: VIN 3.3V GND SCL SDA, 0.1" pitch -->
  <g>
    <circle cx="28.8" cy="57" r="3.4" fill="#d4a017"/><circle cx="28.8" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="38.4" cy="57" r="3.4" fill="#d4a017"/><circle cx="38.4" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="48"   cy="57" r="3.4" fill="#d4a017"/><circle cx="48"   cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="57.6" cy="57" r="3.4" fill="#d4a017"/><circle cx="57.6" cy="57" r="1.6" fill="#0d0d0d"/>
    <circle cx="67.2" cy="57" r="3.4" fill="#d4a017"/><circle cx="67.2" cy="57" r="1.6" fill="#0d0d0d"/>
  </g>
</svg>
